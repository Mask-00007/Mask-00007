name: activity graph

on:
  schedule:
    - cron: "17 */6 * * *"   # four times a day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate SVG
        run: node scripts/generate-graph.js
        env:
          GH_USER: Mask-00007
          # Swap to secrets.GH_GRAPH_TOKEN if you want private contributions counted.
          GH_TOKEN: ${{ secrets.GH_GRAPH_TOKEN || github.token }}
          OUT_PATH: assets/activity-graph.svg

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-graph.svg
          git diff --staged --quiet || git commit -m "chore: refresh activity graph"
          git push
